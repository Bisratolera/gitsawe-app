name: Release

# Push a tag such as v1.0.0 to build a signed app bundle (for Google Play) and
# signed APKs, and publish them as a GitHub Release. See docs/RELEASING.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      upload_to_play:
        description: 'Also upload the bundle to Google Play (needs PLAY_SERVICE_ACCOUNT_JSON)'
        type: boolean
        default: false
      play_track:
        description: 'Play track (internal, alpha, beta, production)'
        default: internal

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Work out version
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="$(grep -E '^version:' pubspec.yaml | sed -E 's/version:\s*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          fi
          # Play requires versionCode to increase with every upload.
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Building ${NAME}+${GITHUB_RUN_NUMBER}"

      - name: Set up release signing
        run: |
          if [[ "${HAS_KEYSTORE}" != "true" ]]; then
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing – a release must be signed. See docs/RELEASING.md."
              exit 1
            fi
            echo "::warning::No keystore secret: building with the DEBUG key (not uploadable to Play)."
            exit 0
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storeFile=app/upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests
        run: flutter test

      - name: Build app bundle (Google Play)
        run: flutter build appbundle --release --build-name=${{ steps.ver.outputs.name }} --build-number=${{ steps.ver.outputs.code }}

      - name: Build APKs (GitHub release)
        run: |
          flutter build apk --release --build-name=${{ steps.ver.outputs.name }} --build-number=${{ steps.ver.outputs.code }}
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/universal.apk
          flutter build apk --release --split-per-abi --build-name=${{ steps.ver.outputs.name }} --build-number=${{ steps.ver.outputs.code }}

      - name: Collect release files
        run: |
          V="${{ steps.ver.outputs.name }}"
          mkdir -p dist
          cp build/app/outputs/bundle/release/app-release.aab "dist/gitsawe-${V}.aab"
          cp build/app/outputs/flutter-apk/universal.apk "dist/gitsawe-${V}-universal.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/gitsawe-${V}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/gitsawe-${V}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "dist/gitsawe-${V}-x86_64.apk"
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: gitsawe-release-files
          path: dist/*

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Upload to Google Play
        if: env.HAS_PLAY == 'true' && (github.ref_type == 'tag' || inputs.upload_to_play)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.gitsawe.app
          releaseFiles: dist/gitsawe-${{ steps.ver.outputs.name }}.aab
          track: ${{ inputs.play_track || 'internal' }}
          # 'draft' is required until the app's first release has been completed by hand in Play Console.
          status: draft

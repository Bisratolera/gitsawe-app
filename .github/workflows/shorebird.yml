name: Deploy Shorebird Patch

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      action:
        description: 'Create the initial Shorebird release or publish a patch'
        required: true
        type: choice
        options:
          - release
          - patch
        default: patch

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Checkout code
        uses: actions/checkout@v4

      # Setup Java because Android builds require it
      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # CORRECTED: Pulls from the dedicated setup-shorebird repository
      - name: 🐦 Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true # Optional: speeds up future runs

      - name: 🔐 Validate Shorebird API key
        shell: bash
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          if [[ -z "$SHOREBIRD_TOKEN" ]]; then
            echo "::error::Missing GitHub Actions secret SHOREBIRD_TOKEN. Add a Shorebird API key (sb_api_...) under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [[ "$SHOREBIRD_TOKEN" != sb_api_* ]]; then
            echo "::error::SHOREBIRD_TOKEN must be a Shorebird API key beginning with sb_api_; legacy CI tokens are no longer supported."
            exit 1
          fi

      # Run this once to create the base release before publishing patches.
      - name: 📦 Create Android Release
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'release'
        run: shorebird release android
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

      - name: 🚀 Deploy Android Patch
        if: github.event_name == 'push' || inputs.action == 'patch'
        uses: shorebirdtech/shorebird-patch@v1
        with:
          platform: android
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
